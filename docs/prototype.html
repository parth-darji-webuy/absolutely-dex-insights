// ---------- Date and time helpers for reports: always full date, time, year and time zone ----------
const pad2 = n => String(n).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const hms = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const niceDate = d => `${pad2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`;   // 21 Oct 2026
function tzLabel(d = new Date()) {
  let name = 'Local time'; try { name = Intl.DateTimeFormat().resolvedOptions().timeZone || name; } catch (e) { }
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '−';
  return `${name} (UTC${sign}${pad2(Math.floor(Math.abs(off) / 60))}:${pad2(Math.abs(off) % 60)})`;
}

// ---------- Statement-style period: any day range, like a bank statement ----------
const DAY = 864e5;
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseYMD = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const daysBetween = (a, b) => Math.round((dayStart(b) - dayStart(a)) / DAY) + 1;   // inclusive
const TODAY = () => dayStart(new Date());
const TRACK_START = (() => { const t = new Date(2026, 8, 1); return t < TODAY() ? t : addDays(TODAY(), -90); })();  // tracking began 1 Sep 2026
const RANGE_MAX = 366;                     // longest period one download can cover
function presetRange(k) {
  const t = TODAY();
  if (k === '7d') return [addDays(t, -6), t];
  if (k === '30d') return [addDays(t, -29), t];
  if (k === 'thisMonth') return [new Date(t.getFullYear(), t.getMonth(), 1), t];
  if (k === 'lastMonth') return [new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 0)];
  return null;
}
function rangeError(from, to) {
  if (!from || !to) return 'Choose both a From and a To date.';
  if (from > to) return 'The From date must be on or before the To date.';
  if (to > TODAY()) return 'The To date can’t be in the future.';
  if (from < TRACK_START) return `Data starts on ${niceDate(TRACK_START)}. Pick a later From date.`;
  if (daysBetween(from, to) > RANGE_MAX) return `A download covers at most ${RANGE_MAX} days. Shorten the period.`;
  return '';
}
const eachDay = (from, to) => Array.from({ length: daysBetween(from, to) }, (_, i) => addDays(from, i));
// Experiment people per variant on one day (from its own daily history, then a steady pace after that).
function expDay(e, d) {
  const start = dayStart(new Date(e.start)), i = Math.round((dayStart(d) - start) / DAY);
  if (i < 0 || dayStart(d) > TODAY()) return null;
  const dp = dailyPeople(e);
  if (i < dp.c.length) return { c: dp.c[i], t: dp.t[i] };
  const r = rng(seedOf(e.key + ymd(d))), avg = e.people / e.days / 2;
  return { c: Math.round(avg * (.85 + r() * .3)), t: Math.round(avg * (.85 + r() * .3)) };
}

// ---------- Reports: one experiment's daily results for a period (Reports page) ----------
// Builds the details shown above the table, the column headers, and the rows.
function buildReport(exp, from, to) {
  const now = new Date(), e = EBY[exp], u = me();
  const head = ['date', 'weekday', 'experiment', 'flag', 'variant', 'label', 'people', 'converted', 'rate_pct', 'metric'];
  const rows = eachDay(from, to).flatMap(d => { const x = expDay(e, d); if (!x) return [];
    return ['c', 't'].map(k => { const n = x[k], c = Math.round(n * (k === 'c' ? e.rc : e.rt) / 100); return [ymd(d), WDAY[d.getDay()], e.name, e.flag, k === 'c' ? 'control' : 'treatment', e[k].label, n, c, (n ? c / n * 100 : 0).toFixed(2), e.metricShort]; }); });
  const name = `${e.name} · daily results`, period = `${niceDate(from)} – ${niceDate(to)} (${daysBetween(from, to)} day${daysBetween(from, to) > 1 ? 's' : ''})`;
  const meta = [['Report', name], ['Workspace', 'AbsolutelyDeX Insights'], ['Period', period], ['Generated', `${niceDate(now)}, ${hms(now)}`], ['Time zone', tzLabel(now)], ['Generated by', `${u.name} (${u.role})`], ['Rows', String(rows.length)]];
  const span = ymd(from) === ymd(to) ? ymd(from) : `${ymd(from)}_to_${ymd(to)}`;
  return { name, meta, head, rows, file: `absolutelydex_${exp}-daily_${span}.csv` };
}
function downloadCSV(name, lines) {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  // the BOM makes Excel read £, ’ and – correctly
  const csv = '﻿' + lines.map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
}
// Reports page: one period and one experiment choice for every download; no pop-up, no preview
const RPR = { preset: '7d', from: null, to: null, exp: 'all' };
[RPR.from, RPR.to] = presetRange('7d');
const PAGE_PRESETS = [['7d', 'Last 7 days'], ['30d', 'Last 30 days'], ['thisMonth', 'This month'], ['lastMonth', 'Last month']];
function periodBar() {
  const err = rangeError(RPR.from, RPR.to), n = RPR.from && RPR.to ? daysBetween(RPR.from, RPR.to) : 0;
  const opts = [['all', 'All experiments']].concat(EXPS.map(e => [e.key, e.name]));
  return `<label class="pbar-exp">Experiment <select class="input" data-act="rExp">${opts.map(([v, l]) => `<option value="${v}" ${RPR.exp === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
    <div class="pbar-presets">${PAGE_PRESETS.map(([k, l]) => `<button class="chip ${RPR.preset === k ? 'on' : ''}" data-act="rPreset" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="pbar-dates">
      <label>From <input type="date" class="input ${err ? 'bad' : ''}" data-act="rDate" data-k="from" value="${RPR.from ? ymd(RPR.from) : ''}" min="${ymd(TRACK_START)}" max="${ymd(TODAY())}"></label>
      <label>To <input type="date" class="input ${err ? 'bad' : ''}" data-act="rDate" data-k="to" value="${RPR.to ? ymd(RPR.to) : ''}" min="${ymd(TRACK_START)}" max="${ymd(TODAY())}"></label>
    </div>
    <span class="pbar-sum ${err ? 'bad' : ''}">${err ? esc(err) : `${niceDate(RPR.from)} – ${niceDate(RPR.to)} · ${n} day${n > 1 ? 's' : ''}`}</span>`;
}
const repExps = () => EXPS.filter(e => RPR.exp === 'all' || e.key === RPR.exp);
const repSub = () => `${repExps().length} experiment${repExps().length > 1 ? 's' : ''} · one row per day, per variant`;
// one row per experiment, with how much data the chosen period holds
function expReportRows() {
  const bad = !!rangeError(RPR.from, RPR.to);
  return repExps().map(e => {
    const days = bad ? [] : eachDay(RPR.from, RPR.to).map(d => expDay(e, d)).filter(Boolean), people = sum(days.map(x => x.c + x.t));
    const inPeriod = bad ? '<span class="faint">—</span>' : days.length ? `<b>${fmt(people)}</b> people<div class="faint" style="font-size:12px">${days.length} day${days.length > 1 ? 's' : ''} · ${days.length * 2} rows</div>` : '<span class="faint">Not running in this period</span>';
    return `<tr><td><span style="display:inline-flex;gap:12px;align-items:center;white-space:normal"><span class="conn-ic" style="width:34px;height:34px;flex:none">${ic('flask')}</span><span><b style="font-weight:550">${esc(e.name)} · daily results</b><div class="faint" style="font-size:12px">Flag <code class="flag">${e.flag}</code> · ${esc(e.metricShort)} · from <code>experiment_tracking</code> + <code>${e.mtable}</code></div></span></span></td>
      <td>${statusBadge(e.status)}</td>
      <td class="muted">${niceDate(new Date(e.start))}</td>
      <td class="tnum">${inPeriod}</td>
      <td style="text-align:right"><button class="btn sm primary" data-act="repNow" data-exp="${e.key}" ${days.length ? '' : 'disabled'}>${ic('download', 'sm')} Download CSV</button></td></tr>`;
  }).join('');
}
function refreshPeriod() {
  const bar = $('#pbar'); if (bar) bar.innerHTML = periodBar();

function pReports() {

function siteCard({ quick = true, heat = false, clickable = false } = {}) {
  const p1 = n => pct(n / QV.seen * 100);
  return `<div class="site site-card">
    <div class="sc-img" style="background-image:url(${QV_IMG})">
      <div class="sc-badges"><span class="b-red">-20%</span><span class="b-amber">Trending</span><span class="b-violet">New</span></div>
      <button class="sc-heart ${heat ? 'hs' : ''}" style="--a:.15" tabindex="-1">${ic('heartS')}${heat ? hot(p1(QV.heartCard), `Wishlisted from the card: ${fmt(QV.heartCard)} of ${fmt(QV.seen)}`, true) : ''}</button>
      ${quick ? `<div class="sc-actions">
        <button class="sc-qv ${heat ? 'hs' : ''} ${clickable ? 'qv-open' : ''}" style="--a:.7" ${clickable ? 'data-act="openQV"' : 'tabindex="-1"'}>${ic('bag', 'sm')} Quick View${heat ? hot(p1(QV.btn), `Opened via the Quick View button: ${fmt(QV.btn)} of ${fmt(QV.seen)} who saw it`) : ''}</button>
        <button class="sc-eye ${heat ? 'hs' : ''} ${clickable ? 'qv-open' : ''}" style="--a:.3" ${clickable ? 'data-act="openQV"' : 'tabindex="-1"'}>${ic('eye', 'sm')}${heat ? hot(p1(QV.eye), `Opened via the eye icon: ${fmt(QV.eye)} of ${fmt(QV.seen)}`, true) : ''}</button>

function afterRender() {
  if (S.booting) return;
  // runners sprint to their spot, then stop; the leader gets a star
  $$('.runner[data-to]').forEach((r, i) => {
    const to = r.dataset.to + '%';
    const done = () => { r.style.left = to; r.classList.remove('walking'); r.classList.add('idle', 'done'); };
    if (reducedMotion() || !r.animate) return done();
    r.animate([{ left: '3%' }, { left: to }], { duration: 1600 + i * 250, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards', delay: 250 }).onfinish = done;
  });
  $$('.num[data-count]').forEach(el => {
    const to = +el.dataset.count, f = el.dataset.fmt, t0 = performance.now(), dur = 900;
    const step = now => { const k = Math.min(1, (now - t0) / dur), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = f === 'int' ? fmt(v) : pct(v); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
