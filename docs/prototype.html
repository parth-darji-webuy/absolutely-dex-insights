<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AbsolutelyDeX Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Design tokens. Accent is reserved for: primary actions,
   the leading/winner state and the active nav item.
   ============================================================ */
:root{
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
/* Light, GrowthBook-style palette */
:root{
  color-scheme:light;
  --bg:#F6F7FA; --side:#1E2858; --card:#FFFFFF; --card2:#F3F4F8; --hover:#F0F1F6;
  --border:#E2E5EC; --border2:#D0D5DF;
  --text:#1C2024; --text2:#596070; --text3:#8A90A0;
  --accent:#6E56CF; --accent-h:#5D46BD; --accent-soft:rgba(110,86,207,.09); --accent-text:#5B44BC; --on-accent:#fff;
  --green:#14916A; --green-soft:rgba(20,145,106,.08);
  --red:#D04444; --red-soft:rgba(208,68,68,.07);
  --amber:#A86A0E; --amber-soft:rgba(232,160,50,.11); --amber-border:rgba(200,130,30,.35);
  --sk1:#EDEFF4; --sk2:#F8F9FB;
  --c1:#4F72D0; --c2:#8A5CEB; --c3:#22998B; --c4:#C2569C; --c5:#7D879C; --c6:#C9822E;
  --scrim:rgba(20,24,40,.22); --shadow:0 16px 48px rgba(20,24,40,.14); --grid:rgba(15,20,40,.06);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
code,.mono{font-family:var(--mono);font-size:12px}
.tnum,.num,table{font-variant-numeric:tabular-nums}
.muted{color:var(--text2)} .faint{color:var(--text3)}
.lbl{font-size:12px;color:var(--text2);font-weight:500}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
::selection{background:var(--accent-soft)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--sw,228px) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:2px;z-index:30;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 20px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.bm{display:flex;flex-direction:column;gap:6px;width:176px}
.bm img{display:block;width:100%;height:auto}
.bm-ins{display:flex;justify-content:space-between;padding:0 3px 0 4px;font:500 9.5px/1 var(--font)}
.bm-ins i{font-style:normal}
.bm-light .bm-ins{color:#C9CDEA}
.bm-dark .bm-ins{color:#24274A}
.bm-white .bm-ins{color:rgba(255,255,255,.9)}
.brand-mark{display:none;width:42px;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:8px;color:var(--text2);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent-text)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--border2);flex:none}

.main{min-width:0;display:flex;flex-direction:column}
/* ---------- Header: search on the left, account on the right, 64px to line up with the logo band ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:64px;padding:0 32px;background:var(--card);border-bottom:1px solid var(--border)}
.askbar{display:flex;align-items:center;gap:10px;flex:1 1 auto;max-width:880px;min-width:0;height:42px;padding:0 8px 0 14px;border:1px solid transparent;border-radius:8px;background:var(--card2);color:var(--text3);font-size:14px;cursor:text;transition:background .15s,border-color .15s,box-shadow .15s}
.askbar span{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.askbar .short{display:none}
.askbar kbd{flex:none;background:var(--card);border-color:var(--border)}
.askbar:hover{background:var(--card);border-color:var(--border2)}
.askbar:focus-visible{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acct{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none;min-width:0}
.acct .avatar{width:36px;height:36px;border:0;color:#fff;font-size:12.5px;background:linear-gradient(135deg,#3B5BFF,#A54BF5)}
.acct .who{display:flex;flex-direction:column;line-height:1.35;min-width:0;max-width:240px}
.acct .who b{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .who span{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .signout{height:36px;margin-left:8px;color:var(--text2)}
.acct .signout:hover{color:var(--text);border-color:var(--border2);background:var(--hover)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative;flex:none}
.live-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);opacity:0;animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.6);opacity:0}}
kbd{font:500 11px var(--font);padding:1px 6px;border-radius:5px;border:1px solid var(--border2);color:var(--text3);background:var(--card2)}
.btn.hamburger{display:none}
.nav-scrim{display:none;position:fixed;inset:0;z-index:25;background:var(--scrim)}
.page{padding:28px 32px 140px;width:100%;max-width:1380px;margin:0 auto}
.page > * + *{margin-top:24px}

/* ---------- Buttons, chips, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--hover);border-color:var(--border2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.block{width:100%;height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;padding:0;position:relative}
.link{color:var(--accent-text);font-weight:500;cursor:pointer;background:none;border:0;padding:0;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{background:var(--card2);border-color:var(--text3);color:var(--text)}
.chip .n{color:var(--text3);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:550;border:1px solid var(--border2);color:var(--text2);background:var(--card2);white-space:nowrap}
.tag.ai{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.tag.lead{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent);background:var(--green-soft)}
.tag.warn{color:var(--amber);border-color:var(--amber-border);background:var(--amber-soft)}
.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent);background:var(--red-soft)}
.tag.plain{background:transparent}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;color:var(--text2)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.status.running i{background:var(--green)}
.flag{padding:2px 7px;border-radius:6px;background:var(--card2);border:1px solid var(--border);color:var(--text2)}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--text2)}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card-h h3{font-size:14px;font-weight:600;letter-spacing:-.005em}
.card-h .sub{font-size:12px;color:var(--text3);margin-top:2px}
.card-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card-b{padding:16px 20px 20px}
.fade{animation:fade .45s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}

/* KPI cards: label, big number, delta, sparkline. Nothing else. */
.kpi{padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .val{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:500;color:var(--text2);letter-spacing:0;margin-left:6px}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3)}
.kpi .spark{position:absolute;right:16px;top:18px;width:96px;height:34px;color:var(--text3)}
a.kpi:hover,button.kpi:hover{border-color:var(--border2)}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}

/* ---------- States: skeleton / empty / error ---------- */
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 45%,var(--sk1) 65%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-50% 0}}
.sk-stack{display:flex;flex-direction:column;gap:12px}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:34px 16px;min-height:140px}
.state b{font-weight:600;font-size:14px}
.state p{font-size:13px;color:var(--text2);max-width:340px}
.state .btn{margin-top:8px}

/* ---------- Charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--font);fill:var(--text3);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .guide{stroke:var(--text3);stroke-width:1;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.chart .hit{cursor:crosshair}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text2);font-size:12px;cursor:pointer}
.lg:hover{background:var(--hover)}
.lg i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.lg.off{opacity:.45;text-decoration:line-through}
.lg.off i{background:transparent;border:1.5px solid var(--c)}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--card);border:1px solid var(--border2);border-radius:9px;box-shadow:var(--shadow);padding:9px 11px;font-size:12px;min-width:150px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-variant-numeric:tabular-nums}
.tip.show{opacity:1;transform:none}
.tip .th{font-weight:600;margin-bottom:5px;color:var(--text)}
.tip .tr{display:flex;align-items:center;gap:8px;color:var(--text2);line-height:1.7}
.tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .tr b{margin-left:auto;color:var(--text);font-weight:600;padding-left:12px}
.tip .tt{border-top:1px solid var(--border);margin-top:5px;padding-top:5px}

/* ---------- Overview ---------- */
.summary{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;background:linear-gradient(90deg,var(--accent-soft),transparent 70%),var(--card)}
.summary .spk{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.summary .txt{flex:1;min-width:0}
.summary .line{font-size:15px;font-weight:550;letter-spacing:-.005em}
.summary .meta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.numbers{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;display:none}
.numbers.open{display:block;animation:fade .3s var(--ease)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv div{padding:10px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--border)}
.kv span{display:block;font-size:12px;color:var(--text3)}
.kv b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.rank{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:18px 34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:0}
.rank-row .i{color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums}
.rank-row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--card2);margin-top:6px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:2px;background:var(--text3);transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes barup{from{transform:scaleY(0)}}
.rank-row .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rank-row .v span{display:block;font-size:11px;color:var(--text3);font-weight:500}
.ptile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:650;letter-spacing:.02em;color:hsl(var(--h) 50% 38%);background:hsl(var(--h) 60% 50% / .10);border:1px solid hsl(var(--h) 45% 55% / .22)}


.swatch{width:12px;height:12px;border-radius:4px;border:1px solid var(--border2)}

/* ---------- Experiments ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.xcard{display:flex;flex-direction:column;gap:12px;padding:20px;transition:border-color .15s,transform .15s}
.xcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.xcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xcard h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.xcard p{font-size:13px;color:var(--text2);margin-top:2px}
.xstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.xstats b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.xstats span{font-size:12px;color:var(--text3)}
.progress{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;border:1px solid var(--border)}
.progress i{display:block;height:100%;background:var(--text3);border-radius:3px;transform-origin:left;animation:grow 1s var(--ease) both}
.progress.done i{background:var(--text2)}
.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-top:6px;font-variant-numeric:tabular-nums}

.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3)}
.crumbs a:hover{color:var(--text)}
.xhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.xhead h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.xhead .meta{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.warnbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;border:1px solid var(--amber-border);background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:500}
.warnbar span{color:var(--text)}
/* Traffic split line on each experiment */
.traffic{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:13px}
.traffic.off{border-color:var(--amber-border);background:var(--amber-soft)}
.traffic .tl-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--green-soft);color:var(--green)}
.traffic.off .tl-ic{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.traffic .tl-txt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.traffic .tl-txt b{font-weight:600;color:var(--text)}
.traffic .tl-txt span{font-size:12px;color:var(--text3)}
.traffic .tl-bar{position:relative;flex:1;min-width:140px;height:10px}
.traffic .tl-fill{display:flex;gap:2px;height:100%;border-radius:5px;overflow:hidden}
.traffic .tl-bar i{height:100%;transform-origin:left;animation:growx .8s var(--ease) both}
.traffic .tl-bar i.c{background:var(--text3)}
.traffic .tl-bar i.t{background:var(--c);animation-delay:.15s}
.traffic .tl-bar .mid{position:absolute;left:calc(50% - 1px);top:-5px;bottom:-5px;width:2px;border-radius:1px;background:var(--text)}
.traffic .tl-note{color:var(--amber);font-weight:550;white-space:nowrap}
.traffic .link{color:var(--amber);white-space:nowrap}
@media (max-width:820px){.traffic{flex-wrap:wrap;row-gap:12px}.traffic .tl-txt{flex:1 1 200px}.traffic .tl-bar{flex-basis:100%;order:3}.traffic .tl-note,.traffic .link,.traffic .tag{order:4}}
.warnbar .link{margin-left:auto;color:var(--amber)}
.verdict{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:center;background:radial-gradient(600px 200px at 0% 0%,var(--accent-soft),transparent 70%),var(--card)}
.verdict.neutral{background:var(--card)}
.verdict h2{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.verdict .vb{font-size:16px;color:var(--text2);margin-top:6px}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .big{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.conf{height:8px;border-radius:4px;background:var(--card2);border:1px solid var(--border);position:relative;overflow:hidden}
.conf i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;transform-origin:left;animation:grow 1.1s var(--ease) both}
.verdict.neutral .conf i{background:var(--text3)}
.var-card{padding:20px;display:flex;flex-direction:column;gap:14px}
.var-card.leading{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.var-card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.var-card .rate{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.var-card .rate small{font-size:13px;color:var(--text2);font-weight:500;margin-left:8px;letter-spacing:0}
.vname{font-size:15px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
.input,select.input,textarea.input{height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none;font-size:13.5px;transition:border-color .15s,box-shadow .15s;width:100%}
textarea.input{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.bad{border-color:var(--red)}
.ferr{font-size:12px;color:var(--red);display:flex;align-items:center;gap:5px}
.ro{font-size:14px;line-height:1.6}

/* ---------- Events ---------- */
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;font-weight:500;color:var(--text3);padding:10px 20px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
table.t td{padding:11px 20px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer;transition:background .15s}
table.t tbody tr.click:hover{background:var(--hover)}
.ev{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px}
.ev i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.vid{font-family:var(--mono);font-size:12.5px;color:var(--text2)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);user-select:none;border:0;background:none;padding:0}
.switch .k{width:32px;height:18px;border-radius:9px;background:var(--border2);position:relative;transition:background .2s;flex:none}
.switch .k::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch.on .k{background:var(--accent)}
.switch.on .k::after{transform:translateX(14px)}
.switch.on{color:var(--text)}

/* ---------- Drawer, popover, palette, toasts ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--card);border-left:1px solid var(--border);z-index:90;transform:translateX(102%);transition:transform .28s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer:not(.open){box-shadow:none}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.dh h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.dh p{font-size:12.5px;color:var(--text3);margin-top:3px}
.db{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:24px}
.db h4{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
pre.json{margin:0;padding:14px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--border);font:12.5px/1.65 var(--mono);overflow-x:auto;color:var(--text2)}
pre.json .k{color:var(--text)} pre.json .s{color:var(--accent-text)} pre.json .n{color:var(--c3)}
.masked{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.masked div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px}
.masked div:last-child{border-bottom:0}
.masked span{color:var(--text3)}
.masked b{font-family:var(--mono);font-weight:500;font-size:12.5px}
.notice{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--border);font-size:12.5px;color:var(--text2)}
.journey{position:relative;display:flex;flex-direction:column;gap:2px;padding-left:4px}
.journey::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:1px;background:var(--border2)}
.jstep{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 0;position:relative}
.jstep .jd{width:15px;height:15px;border-radius:50%;background:var(--card);border:2px solid var(--c);margin-top:2px;box-shadow:0 0 0 4px var(--card)}
.jstep.cur .jd{background:var(--c)}
.jstep b{font-weight:550;font-size:13.5px}
.jstep p{font-size:12px;color:var(--text3)}
.jstep .t{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.jstep.cur b::after{content:"this event";margin-left:8px;font-size:11px;font-weight:500;color:var(--text3);border:1px solid var(--border2);border-radius:5px;padding:1px 6px}

.pop{position:fixed;z-index:120;background:var(--card);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);min-width:200px;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu{padding:6px;display:flex;flex-direction:column}
.menu .flag-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text);text-decoration:none}
.menu .flag-row:hover{background:var(--hover)}
.menu .flag-row code{flex:none;white-space:nowrap}
.menu .flag-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .mh{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px}
.minibars{display:flex;align-items:flex-end;gap:3px;height:48px}
.minibars i{flex:1;border-radius:2px 2px 0 0;background:var(--text3);opacity:.55;transition:opacity .15s}
.minibars i:hover{opacity:1}

.palette-wrap{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;background:var(--scrim)}
.palette-wrap[hidden]{display:none}
.palette{width:min(640px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .18s var(--ease)}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text3)}
.palette .pin input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--text)}
.plist{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.pg{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.pi{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text)}
.pi .ic{color:var(--text3)}
.pi .hint{margin-left:auto;font-size:12px;color:var(--text3)}
.pi.sel{background:var(--hover)}
.pi.sel .ic{color:var(--text)}
.pfoot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text3)}

.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:220;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:10px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:toast .25s var(--ease)}
@keyframes toast{from{opacity:0;transform:translateY(8px)}}

/* ---------- Reports page: period and experiment ---------- */
.pbar-exp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.pbar-exp .input{width:240px;height:34px;cursor:pointer}
.pbar{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.pbar-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pbar-h b{font-weight:600;font-size:14px}
.pbar-h span{font-size:12.5px;color:var(--text3)}
.pbar-b{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pbar-presets{display:flex;gap:6px;flex-wrap:wrap}
.pbar-presets .chip{height:30px}
.pbar-dates{display:flex;gap:10px;flex-wrap:wrap}
.pbar-dates label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.pbar-dates .input{width:160px;height:34px;font-variant-numeric:tabular-nums;cursor:pointer}
.pbar-sum{margin-left:auto;font-size:13px;font-weight:550;color:var(--text)}
.pbar-sum.bad{color:var(--red);font-weight:500}
@media (max-width:820px){.pbar-sum{margin-left:0;width:100%}.pbar-dates .input{width:150px}}

/* ---------- Products ---------- */
.heat td.h{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.heat td.h span{display:inline-block;min-width:74px;padding:5px 9px;border-radius:7px;background:var(--hc);color:var(--text)}
.heat td:first-child{width:36%}
.heat th.r{text-align:right}
.callout{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:11.5px;font-weight:550;color:var(--text2);border:1px dashed var(--border2);border-radius:6px;padding:2px 7px;vertical-align:middle}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3)}
.heat-legend i{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(215 70% 55% / .12),hsl(260 70% 60% / .4),hsl(305 70% 60% / .7))}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-size:13.5px;margin-top:16px}
.insight .ic{margin-top:3px;color:var(--text2)}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:170px minmax(0,1fr) 110px;gap:16px;align-items:center}
.fstep .fl b{display:block;font-weight:550}
.fstep .fl span{font-size:12px;color:var(--text3)}
.fbar{height:36px;border-radius:8px;background:var(--card2);overflow:hidden;border:1px solid var(--border)}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 55%,transparent),color-mix(in srgb,var(--c1) 30%,transparent));transform-origin:left;animation:grow 1s var(--ease) both}
.fstep .fv{text-align:right;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.fstep .fv span{display:block;font-size:12px;color:var(--text3);font-weight:500}
.fdrop{display:grid;grid-template-columns:170px minmax(0,1fr) 110px;gap:16px;font-size:12px;color:var(--text3);padding:2px 0}
.fdrop div{display:flex;align-items:center;gap:8px}
.fdrop.big div{color:var(--amber);font-weight:550}
.fdrop .arrow{width:1px;height:14px;background:var(--border2);margin-left:12px}

/* ---------- Ask your data ---------- */
.ask-hero{padding:28px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(700px 220px at 50% 0%,var(--accent-soft),transparent 70%),var(--card)}
.ask-input{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border:1px solid var(--border2);border-radius:12px;background:var(--card);color:var(--text3)}
.ask-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ask-input input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--text);min-width:0}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.answer{padding:20px;display:flex;flex-direction:column;gap:14px}
.answer .q{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px}
.answer .a{font-size:16px;line-height:1.55;font-weight:500;letter-spacing:-.005em}
.answer .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.answer details summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:6px}
.answer details summary::-webkit-details-marker{display:none}
.answer details[open] summary .chev{transform:rotate(180deg)}
.answer details .inner{margin-top:12px;display:flex;flex-direction:column;gap:12px}
pre.query{margin:0;padding:12px 14px;border-radius:9px;background:var(--card2);border:1px solid var(--border);font:12px/1.6 var(--mono);color:var(--text2);overflow-x:auto}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini td,table.mini th{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}
table.mini th{font-size:12px;color:var(--text3);font-weight:500}
table.mini td.r,table.mini th.r{text-align:right;font-variant-numeric:tabular-nums}
table.mini tr:last-child td{border-bottom:0}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:140px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.hb .tr{height:14px;border-radius:4px;background:var(--card2);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--text3);border-radius:4px;transform-origin:left;animation:grow .8s var(--ease) both}
.hb.win .tr i{background:var(--c2)}
.hb b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.thinking{display:flex;gap:6px;align-items:center;color:var(--text3);font-size:13px}

.conn-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--border);color:var(--text2)}

/* ---------- Login ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.form-err{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);color:var(--red);font-size:13px}
.form-err span{color:var(--text)}
/* ---------- Sign in ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);background:#fff}
.auth-side{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:48px 48px 104px;color:#fff;
  background:linear-gradient(170deg,#1d0c58 0%,#2f1784 34%,#4a26b5 66%,#6236cf 100%)}
.auth-side::before{content:"";position:absolute;width:150%;height:62%;left:-48%;top:-6%;border-radius:0 0 50% 0;background:rgba(255,255,255,.035);transform:rotate(-24deg)}
.auth-side::after{content:"";position:absolute;inset:-30%;background:linear-gradient(162deg,transparent 46%,rgba(255,255,255,.05) 46%,rgba(255,255,255,.05) 53%,transparent 53%,transparent 74%,rgba(255,255,255,.04) 74%,rgba(255,255,255,.04) 80%,transparent 80%)}
.auth-side h1{font-size:clamp(28px,2.6vw,42px);font-weight:400;line-height:1.25;letter-spacing:-.01em}
.auth-copy{position:relative;z-index:1;width:100%;max-width:460px}
.auth-rot{margin-top:14px;min-height:24px;font-size:16px;color:rgba(255,255,255,.8)}
#authRot{display:inline-block}
#authRot.in{animation:fade .5s var(--ease)}
.auth-dots{display:flex;gap:6px;margin-top:14px}
.auth-dots button{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.32);cursor:pointer;transition:width .35s var(--ease),background .35s}
.auth-dots button:hover{background:rgba(255,255,255,.6)}
.auth-dots button.on{width:24px;background:#fff}
.auth-glow{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(460px circle at var(--mx,60%) var(--my,45%),rgba(255,255,255,.12),transparent 65%)}
.auth-side.lit .auth-glow{opacity:1}
/* preview cards */
.auth-scene{position:relative;z-index:1;width:100%;max-width:460px;height:310px;perspective:900px}
.ac{position:absolute;color:#fff;transition:transform .3s cubic-bezier(.2,.7,.3,1);will-change:transform}
.ac-in{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 24px 48px -22px rgba(8,0,40,.7);animation:acfloat 7s ease-in-out infinite;transition:background .2s,border-color .2s}
.ac:hover .ac-in{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.34)}
@keyframes acfloat{50%{transform:translateY(-9px)}}
.ac-exp{top:0;right:0;width:300px}
.ac-live{top:138px;left:0;width:200px}
.ac-live .ac-in{animation-duration:8s;animation-delay:-3s}
.ac-trend{bottom:0;right:22px;width:236px}
.ac-trend .ac-in{animation-duration:6s;animation-delay:-1.5s}
.ac-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .live-dot{background:#5FF2B0}
.ac .live-dot::after{border-color:#5FF2B0}
.ac-row{display:grid;grid-template-columns:82px minmax(0,1fr) 44px;align-items:center;gap:10px;margin-top:11px;font-size:12.5px}
.ac-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.85)}
.ac-row b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ac-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.ac-bar i{display:block;height:100%;border-radius:4px;background:rgba(255,255,255,.5);transform-origin:left;animation:growx 1.2s var(--ease) both .5s}
.ac-row.lead .ac-bar i{background:#7CF0C0;animation-delay:.7s}
.ac-foot{margin-top:12px;font-size:12px;font-weight:500;color:#A8F5D6}
.ac-big{display:block;margin:4px 0 6px;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.ac-big.bump{animation:bumpz .5s var(--ease)}
.ac-people{display:flex;align-items:flex-end;gap:1px;height:32px}
.ac-people em{margin-left:6px;align-self:center;font-style:normal;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.ac-val{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.ac-val b{font-size:26px;font-weight:600;letter-spacing:-.02em}
.ac-val span{font-size:12px;color:#A8F5D6}
.ac-spark{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
@media (max-width:1180px){.auth-scene{transform:scale(.84)}}
@media (max-height:720px){.auth-scene{display:none}}
@media (prefers-reduced-motion:reduce){.ac-in{animation:none}}
.auth-foot{position:absolute;z-index:1;left:0;right:0;bottom:22px;display:flex;justify-content:center}
.auth-logo{display:none}
.auth-foot .bm{width:210px}
.auth-logo .bm{width:200px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.auth-form{width:min(460px,100%);display:flex;flex-direction:column;gap:22px}
.auth-form h2{font-size:36px;font-weight:400;letter-spacing:-.015em;color:var(--text)}
.auth .form{gap:18px}
.auth label{font-size:15px;font-weight:400;color:var(--text)}
.auth .input{height:48px;font-size:15px;border-radius:4px;border-color:#cfd0d8}
.auth .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.auth .btn.block{height:52px;font-size:17px;font-weight:500;border-radius:4px;margin-top:14px;gap:10px;transition:background .25s,border-color .25s,transform .1s}
.auth .btn.block:active{transform:translateY(1px)}
.auth .btn.block .go{display:flex;transition:transform .2s var(--ease)}
.auth .btn.block:hover .go{transform:translateX(4px)}
.auth .btn.block.loading{pointer-events:none;opacity:.9}
.auth .btn.block.done{pointer-events:none;background:var(--green);border-color:var(--green)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth .auth-form.shake{animation:shake .42s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.in-wrap{position:relative}
.auth .in-wrap .input{padding-left:42px;padding-right:46px}
.auth .input:hover:not(:focus){border-color:#a9abb8}
.in-lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;color:var(--text3);pointer-events:none;transition:color .15s}
.in-wrap:focus-within .in-lead{color:var(--accent)}
.in-ok{position:absolute;right:15px;top:50%;display:flex;color:var(--green);opacity:0;transform:translateY(-50%) scale(.4);transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.in-wrap.ok .in-ok{opacity:1;transform:translateY(-50%) scale(1)}
.in-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--text3);cursor:pointer}
.in-eye:hover{color:var(--text);background:var(--hover)}
.caps{display:none;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--amber)}
.caps.on{display:flex}
.auth.seen .auth-form:not(.shake){animation:none}
.auth :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.qv-pricebox s{color:#999;font-size:15px}
.qv-off{background:var(--s-red);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.qv-buy{display:flex;gap:12px;margin-top:18px}

.modal-wrap{position:fixed;inset:0;z-index:140;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;background:var(--scrim)}

.modal{width:min(1100px,100%);background:var(--card);border:1px solid var(--border2);border-radius:16px;box-shadow:var(--shadow);animation:pop .2s var(--ease)}

/* ---------- extra charts ---------- */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{position:relative;flex:none}
.donut svg{width:100%;height:100%;display:block}
.donut .seg{transition:opacity .15s;cursor:pointer}
.donut:hover .seg{opacity:.5} .donut .seg:hover{opacity:1}

.dc span{font-size:11px;color:var(--text3)}
.dlist{flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px}
.dlist div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 48px;gap:10px;align-items:center;font-size:13px}

.dlist b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

.dev-row .tr{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.dev-row .tr i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow .9s var(--ease) both}
.dev-row b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dev-row em{font-style:normal;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}

/* ---------- People: small flat characters with walk / idle motion ---------- */
.person{display:block;overflow:visible}
.person .lg,.person .am{transform-box:fill-box;transform-origin:50% 0}
.walking .person .lg.l,.walking .person .am.r{animation:swing .5s ease-in-out infinite alternate}
.walking .person .lg.r,.walking .person .am.l{animation:swing .5s ease-in-out infinite alternate-reverse}
.walking .person .bd{animation:bob .25s ease-in-out infinite alternate}
.idle .person .bd{animation:breathe 2.6s ease-in-out infinite}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes breathe{50%{transform:translateY(-1.2px)}}

/* Store scene (Overview): stops along a path with the last 30 minutes' counts */
.store{position:relative;height:210px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#F3F0FE 0%,#FAFAFD 72%);border:1px solid var(--border)}
.store .ground{position:absolute;left:0;right:0;bottom:0;height:40px;background:#EDEFF5;border-top:1px solid var(--border)}
.store .path{position:absolute;left:3%;right:3%;bottom:19px;border-top:2px dashed #D3D6E2}
.zone{position:absolute;top:14px;transform:translateX(-50%);text-align:center;font-size:11.5px;color:var(--text2);width:120px}
.zone .zi{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 6px;color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.zone b{display:block;font-size:17px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.2}
@keyframes bumpz{40%{transform:scale(1.25)}}
.walker{position:absolute;bottom:14px;transform:translateX(-50%);z-index:2}
.walker.back{z-index:1;bottom:22px;opacity:.85}
.store-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-top:10px}

@keyframes float{50%{transform:translateY(-4px)}}

/* Character in empty states */
.state-art{position:relative;height:96px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
.state-art .shadow{position:absolute;bottom:0;width:46px;height:6px;border-radius:50%;background:rgba(30,40,88,.08)}

/* ============================================================
   Motion layer. Every animation explains something: lines draw
   in time order, areas rise from zero, people move where the
   data says. All of it turns off under prefers-reduced-motion.
   ============================================================ */
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .9s var(--ease) both}
@keyframes rise{from{transform:scaleY(0);opacity:0}}
.donut .seg{animation:sweep 1s var(--ease) both}
@keyframes sweep{from{stroke-dasharray:0 1000}}
.popin{transform-box:fill-box;transform-origin:center;animation:popin .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popin{from{transform:scale(0);opacity:0}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1s var(--ease) both}
@keyframes growx{from{transform:scaleX(0)}}

/* cards lift a little under the pointer */
.card{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.kpi:hover,.var-card:hover,.answer:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.08)}
.xcard:hover{box-shadow:0 12px 28px rgba(16,24,40,.09)}
.nav a .ic{transition:transform .2s var(--ease)}
.nav a:hover .ic{transform:translateX(2px) scale(1.06)}

/* button ripple */
.btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* AI summary: a slow sheen and a twinkling icon */
.summary{position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 5s ease-in-out 1s infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-100%)}30%,100%{transform:translateX(100%)}}
.summary .spk .ic{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(18deg) scale(1.15)}}
.tag.lead{position:relative;overflow:hidden}
.tag.lead::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4s ease-in-out infinite}

/* AI: thinking dots and a typing caret */
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
.typing::after{content:"";display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.ro p{animation:fade .5s var(--ease) both}
.ro p:nth-child(2){animation-delay:.25s}.ro p:nth-child(3){animation-delay:.5s}

/* funnel: people (dots) flow through, drop-offs fall away */
.fbar{position:relative}
.fbar .flow{position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--c1);left:0;animation:flow linear infinite;opacity:0}
@keyframes flow{0%{left:0;opacity:0}10%{opacity:.9}85%{opacity:.9}100%{left:var(--w);opacity:0}}
.fdrop div:nth-child(2){position:relative}
.fall{position:absolute;left:-14px;top:0;width:6px;height:6px;border-radius:50%;background:var(--text3);animation:fall 1.8s ease-in infinite;opacity:0}
.fdrop.big .fall{background:var(--amber)}
@keyframes fall{0%{transform:translate(0,-6px);opacity:0}20%{opacity:.9}100%{transform:translate(-10px,16px);opacity:0}}

/* experiment race */
.race{display:flex;flex-direction:column;gap:6px}
.lane{position:relative;height:74px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--card2) 0 40px,#fff 40px 41px);border:1px solid var(--border);overflow:hidden}

.walking.run .person .lg.l,.walking.run .person .am.r,.walking.run .person .lg.r,.walking.run .person .am.l{animation-duration:.28s}
.lane .crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:#F5B400;font-size:15px;opacity:0;transition:opacity .4s}

.race-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);padding:2px 12px 0;font-variant-numeric:tabular-nums}

.store{height:230px}
.zone{width:112px;font-size:11px;line-height:1.3}
@media (max-width:1100px){.zone{width:90px;font-size:10px}.zone .zi{width:34px;height:34px}}
@media (max-width:560px){.zone{width:19%;font-size:9.5px;line-height:1.25}.zone .zi{width:30px;height:30px;border-radius:9px}.zone b{font-size:15px}}


/* ---------- Last 30 minutes per experiment (Overview) ---------- */
.lx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.lxcard{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);transition:border-color .15s,box-shadow .15s,transform .15s}
.lxcard:hover{border-color:var(--border2);box-shadow:0 8px 20px rgba(16,24,40,.07);transform:translateY(-1px)}
.lxcard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lx-title{font-weight:600;font-size:13.5px;line-height:1.3}
.lxcard .flag{font-size:10.5px;white-space:nowrap}
.lx-main{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--text2)}
.lx-main b{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lx-tot{display:flex;gap:14px;font-size:12px;color:var(--text3);flex-wrap:wrap}
.lx-tot b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.lx-bars{height:34px;gap:1px}
.lv-head,.lv-row{display:grid;grid-template-columns:minmax(0,1fr) 34px 34px 44px;gap:6px;align-items:center;font-size:12px}
.lv-head{color:var(--text3);font-size:11px;border-top:1px solid var(--border);padding-top:8px}
.lv-head span:nth-child(n+2),.lv-row b,.lv-row em{text-align:right}
.lv-var{display:flex;min-width:0;align-items:center;gap:6px;color:var(--text2)}
.lv-var i{flex:none;width:8px;height:8px;border-radius:2px;background:var(--c)}
.lv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-row b{font-weight:600;font-variant-numeric:tabular-nums}
.lv-row em{font-style:normal;color:var(--text2);font-variant-numeric:tabular-nums}
table.t th.r{text-align:right}

/* ---------- Responsive: tablet first-class, phone usable ---------- */
@media (max-width:1080px){
  .app{--sw:68px}
  .app .label,.app .brand .bm{display:none}
  .app .brand .brand-mark{display:block}
  .app .nav a{justify-content:center;padding:0}
  .app .brand{justify-content:center;padding-left:0;padding-right:0}
  .split{grid-template-columns:1fr}
  .verdict{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:232px;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow)}
  .app.mnav .side{transform:none}
  .app.mnav .nav-scrim{display:block}
  .app.mnav .label{display:inline}
  .app.mnav .brand .bm{display:flex}
  .app.mnav .brand .brand-mark{display:none}
  .app.mnav .nav a{justify-content:flex-start;padding:0 10px}
  .app.mnav .brand{justify-content:flex-start;padding:0 18px}
  .btn.hamburger{display:inline-flex}
  .top{padding:0 16px;gap:10px}
  .askbar{flex:1}
  .askbar kbd,.askbar .long,.acct .who,.acct .signout span{display:none}
  .askbar .short{display:block}
  .acct{gap:8px}
  .acct .signout{width:38px;padding:0;margin-left:0}
  .page{padding:20px 16px 140px}
  .g2{grid-template-columns:1fr}
  .fstep,.fdrop{grid-template-columns:110px minmax(0,1fr) 80px;gap:10px}
}
@media (max-width:560px){ .g3{grid-template-columns:1fr} .xcards{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ============================================================
   GrowthBook-style skin (layered on top of the base tokens):
   deep navy sidebar in both themes, solid violet active item,
   white cards on a light grey canvas, big page headings.
   ============================================================ */
:root{--r:8px;--side-text:#E6E9F5;--side-muted:#A9B0CF;--side-hover:rgba(255,255,255,.08);--side-line:rgba(255,255,255,.10)}
.app{background:linear-gradient(to right,var(--side) var(--sw,228px),transparent var(--sw,228px))}
.side{background:var(--side);border-right:0;color:var(--side-text);padding:0 12px 16px;gap:4px}
.brand{height:64px;margin:0 -12px 12px;padding:0 18px;border-bottom:1px solid var(--side-line);font-size:20px;font-weight:600;letter-spacing:-.01em;color:#fff}
.nav-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:10px 10px 6px;white-space:nowrap}
.nav a{height:42px;color:var(--side-text);font-size:14.5px;border-radius:6px;gap:12px}
.nav a .ic{width:18px;height:18px}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a.on{background:var(--accent);color:#fff}
.page{padding-top:32px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:34px;font-weight:400;letter-spacing:-.025em;line-height:1.15}
.page-h p{color:var(--text2);margin-top:6px;font-size:14.5px}
.btn{border-radius:6px} .input{border-radius:6px}
.card{border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn.primary{font-weight:600}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-text)}
@media (max-width:1080px){
  .app .nav-h{display:none}
}
@media (max-width:820px){
  .app{background:none}
  .app.mnav .nav-h{display:initial}
  .page-h h1{font-size:26px}
}
</style>
</head>

<div id="pop" class="pop" hidden></div>
<div id="tip" class="tip"></div>

// indicative lift range (not GrowthBook's official interval)
const LIFT_CI = { 'add-to-cart': [-3, 45], 'quick-view-ab-test': [-14, 31], 'whats-new-ab-test': [6, 98], 'theme-toggle-ab-test': [-11, 95] };
function liftRange(e) {
  const [a, b] = LIFT_CI[e.key] || [-10, 10];
  const lo = Math.floor((Math.min(a, -10) - 5) / 10) * 10, hi = Math.ceil((Math.max(b, 10) + 5) / 10) * 10;
  const W = 520, H = 134, pl = 20, pr = 20, X = v => pl + (v - lo) / (hi - lo) * (W - pl - pr), y = 52;
  let g = '';
  for (let v = lo; v <= hi; v += 10) g += `<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="20" y2="84"/><text x="${X(v)}" y="104" text-anchor="middle">${v > 0 ? '+' : ''}${v}%</text>`;
  const lead = e.lead ? 'var(--accent)' : 'var(--c1)';
  g += `<defs><linearGradient id="lr${e.key}" x1="0" x2="1"><stop offset="0" stop-color="var(--text3)" stop-opacity=".35"/><stop offset="${((0 - a) / (b - a)).toFixed(3)}" stop-color="var(--text3)" stop-opacity=".35"/><stop offset="${((0 - a) / (b - a)).toFixed(3)}" stop-color="${lead}" stop-opacity=".35"/><stop offset="1" stop-color="${lead}" stop-opacity=".35"/></linearGradient></defs>`;
  g += `<rect class="growx" x="${X(a)}" y="${y - 12}" width="${X(b) - X(a)}" height="24" rx="12" fill="url(#lr${e.key})"/>`;
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="14" y2="90" stroke="var(--text2)" stroke-width="1.5"/><text x="${X(0)}" y="100" text-anchor="middle" style="fill:var(--text2)" dy="16">No change</text>`;
  g += `<circle class="popin" style="animation-delay:.8s" cx="${X(e.lift)}" cy="${y}" r="7" fill="${lead}" stroke="var(--card)" stroke-width="2.5" data-tip="Best estimate: ${e.lift > 0 ? '+' : ''}${e.lift.toFixed(1)}%"/>`;
  g += `<text class="lbl2" x="${X(a)}" y="${y - 18}" text-anchor="middle">${a}%</text><text class="lbl2" x="${X(b)}" y="${y - 18}" text-anchor="middle">+${b}%</text>`;
  const above = Math.round(b / (b - a) * 100);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lift range">${g}</svg></div>
    <p class="muted" style="font-size:13px;margin-top:8px">The real lift is probably between <b>${a}%</b> and <b>+${b}%</b>, with a best guess of <b>${e.lift > 0 ? '+' : ''}${e.lift.toFixed(1)}%</b>. About ${above}% of that range is above zero. The range narrows as more people join.</p>`;
}
// daily people per variant. The add-to-cart test uses hand-set numbers that sum to 1,000 / 1,000
// and end on the 106 / 76 day behind the traffic-split warning.
const DAILY_SPLIT = { 'add-to-cart': { c: [74, 82, 86, 88, 91, 93, 92, 94, 91, 103, 106], t: [76, 86, 90, 92, 94, 97, 96, 98, 95, 100, 76] } };
function splitTotal(total, n, seed) {
  const r = rng(seed), w = Array.from({ length: n }, () => .8 + r() * .4), ws = sum(w);
  const exact = w.map(x => total * x / ws), out = exact.map(Math.floor);
  exact.map((x, i) => [x - out[i], i]).sort((a, b) => b[0] - a[0]).slice(0, total - sum(out)).forEach(([, i]) => out[i]++);
  return out;
}
function dailyPeople(e) {
  if (DAILY_SPLIT[e.key]) return DAILY_SPLIT[e.key];
  const n = e.series.c.length;
  return { c: splitTotal(e.c.people, n, e.key.length), t: splitTotal(e.t.people, n, e.key.length + 3) };
}
// mini two-line trend for experiment cards
function xspark(e) {
  const all = [...e.series.c, ...e.series.t], mn = Math.min(...all) - .5, mx = Math.max(...all) + .5, n = e.series.c.length;
  const P = a => a.map((v, i) => `${i ? 'L' : 'M'}${(i * 200 / (n - 1)).toFixed(1)},${(36 - (v - mn) / (mx - mn) * 32).toFixed(1)}`).join('');
  return `<svg class="xspark" viewBox="0 0 200 40" preserveAspectRatio="none"><path d="${P(e.series.c)}" fill="none" stroke="var(--text3)" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><path d="${P(e.series.t)}" fill="none" stroke="${e.lead ? 'var(--accent)' : 'var(--c1)'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
// last 60 minutes of events, stacked by type, summing to the 529 in the last hour
function lastHour() {
  const r = rng(11), types = Object.keys(EVT_META), share = [.6, .13, .17, .045, .025, .03];
  const w = Array.from({ length: 60 }, (_, i) => .7 + r() * .6 - (i > 44 && i < 50 ? .35 : 0)), ws = sum(w);
  const tot = w.map(x => Math.round(529 * x / ws)); tot[59] += 529 - sum(tot);
  const series = types.map((k, ti) => ({ key: k, name: EVT_META[k].label, color: EVT_META[k].c, values: tot.map(t => ti === 0 ? 0 : Math.round(t * share[ti])) }));
  series[0].values = tot.map((t, i) => t - sum(series.slice(1).map(s => s.values[i])));
  const labels = Array.from({ length: 60 }, (_, i) => i === 59 ? 'now' : `−${59 - i}m`);
  return { labels, series };

const tip = () => $('#tip');
let hoverChart = null;
function showTip(html, x, y) { const t = tip(); t.innerHTML = html; t.classList.add('show'); const w = t.offsetWidth, h = t.offsetHeight; t.style.left = clamp(x + 14, 8, innerWidth - w - 8) + 'px'; t.style.top = clamp(y - h - 12, 8, innerHeight - h - 8) + 'px'; }
function hideTip() { tip().classList.remove('show'); }
document.addEventListener('mousemove', e => {
  const c = e.target.closest?.('.chart[data-chart]');
  if (hoverChart && hoverChart !== c) { const gd = hoverChart.querySelector('.guide'); if (gd) gd.style.opacity = 0; const hd = hoverChart.querySelector('.hd'); if (hd) hd.innerHTML = ''; hoverChart = null; hideTip(); }

function pExperiments() {
  const counts = {}; EXPS.forEach(e => counts[e.status] = (counts[e.status] || 0) + 1);
  const list = EXPS.filter(e => S.expFilter === 'all' || e.status === S.expFilter);
  const st = wstate();
  let body;
  if (st === 'loading') body = `<div class="xcards">${[0, 1, 2].map(i => `<div class="card xcard fade" style="--d:${i * 60}ms">${skeleton('list')}</div>`).join('')}</div>`;
  else if (!list.length) body = `<div class="card">${emptyState('No experiments with this status', 'Pick another filter above.')}</div>`;
  else body = `<div class="xcards">${list.map((e, i) => `
    <a href="#/experiment/${e.key}" class="card xcard fade" style="--d:${i * 50}ms">
      <div class="row">${statusBadge(e.status)}<code class="flag" title="Feature flag">${e.flag}</code></div>
      <div><h3>${e.name}</h3><p>${e.desc}</p></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">${liftBadge(e)}<span class="mini-legend" style="font-size:11px"><span><i class="ln" style="--c:var(--text3)"></i>Control</span><span><i class="ln" style="--c:${e.lead ? 'var(--accent)' : 'var(--c1)'}"></i>Treatment</span></span></div>
      ${xspark(e)}
      <div class="xstats">
        <div><b>${fmt(e.people)}</b><span>people in test</span></div>
        <div><b>${e.days}</b><span>days running</span></div>
        <div><b>${e.chance == null ? '—' : e.chance + '%'}</b><span>sure of leader</span></div>
      </div>
      <div><div class="progress ${e.progress >= 100 ? 'done' : ''}"><i style="width:${e.progress}%"></i></div><div class="pl"><span>Data needed</span><span>${fmt(e.people)} of ${fmt(e.needed)} · ${e.progress}%</span></div></div>
    </a>`).join('')}</div>`;
  return `
  <div class="toolbar fade">
    <button class="chip ${S.expFilter === 'all' ? 'on' : ''}" data-act="expFilter" data-v="all">All <span class="n">${EXPS.length}</span></button>
    ${Object.keys(counts).map(s => `<button class="chip ${S.expFilter === s ? 'on' : ''}" data-act="expFilter" data-v="${s}">${s} <span class="n">${counts[s]}</span></button>`).join('')}
  </div>
  ${body}`;
}

function buyBox(e, side) {
  const v = e[side], rate = side === 'c' ? e.rc : e.rt;
  return `<div class="site bb">
    <div class="bb-img" style="background-image:url(${CAM_IMG})"><span class="bb-off">-8% OFF</span></div>
    <div class="bb-info">
      <div class="qv-brand">APERTURE OPTICS</div>
      <div class="bb-title">Aperture R4 Mirrorless 8K Camera</div>
      <div class="sc-stars"><b>★★★★★</b> 4.9 (29)</div>
      <div class="bb-price"><b>£3299.00</b><s>£3599.00</s></div>
      <div class="bb-opt"><span class="on">Body Only</span><span>Body + 24-70mm Kit</span></div>
      <div class="bb-buy"><div class="bb-qty"><span>-</span><span>1</span><span>+</span></div>
        <button class="bb-btn hs" tabindex="-1">${ic('bag', 'sm')} ${esc(v.label)}${hot(pct(rate), `${fmt(v.conv)} of ${fmt(v.people)} people who saw “${v.label}” added to cart`, side === 'c')}</button>
        <span class="bb-heart">${ic('heartS', 'sm')}</span></div>
    </div>
  </div>`;
}
// The store header, as on the site. Used for the What's New and theme toggle tests.
function siteHeader(e, side) {
  const v = e[side], rate = side === 'c' ? e.rc : e.rt;
  const pill = hot(pct(rate), `${fmt(v.conv)} of ${fmt(v.people)} people who saw “${v.label}” ${e.verb}`, side === 'c');
  const wnHi = e.preview === 'whatsnew' && side === 't';
  const wn = `<span class="wn ${wnHi || e.preview !== 'whatsnew' ? 'hi' : ''} ${e.preview === 'whatsnew' ? 'hs' : ''}">What’s New${wnHi ? '<i class="nb">NEW</i>' : ''}${e.preview === 'whatsnew' ? pill : ''}</span>`;
  const tg = `<span class="hdr-ib theme ${e.preview === 'theme' ? 'hs' : ''} ${e.preview === 'theme' && side === 't' ? 'wide' : ''}">${ic('moonS', 'sm')}${e.preview === 'theme' && side === 't' ? '<em>Dark mode</em>' : ''}${e.preview === 'theme' ? pill : ''}</span>`;
  return `<div class="site hdr">
    <div class="hdr-logo">Absolutely<span>DeX</span><small>FASHION · TECHNOLOGY · WHAT’S NEXT</small></div>
    <div class="hdr-nav"><span>Shop</span><span>Fashion</span><span>Technology</span>${wn}</div>
    <div class="hdr-icons">${tg}<span class="hdr-ib">${ic('heartS', 'sm')}</span><span class="hdr-ib cart">${ic('bag', 'sm')}</span></div>
  </div>`;
}
function previewHTML(e, side) {
  const cap = t => `<span class="faint" style="font-size:12px;align-self:flex-start">${t}</span>`;
  if (e.preview === 'whatsnew' || e.preview === 'theme') return `<div class="pv-wrap"><span class="faint" style="font-size:12px;align-self:flex-start">Header on your site · number = share who ${e.verb}</span>${siteHeader(e, side)}</div>`;
  if (e.preview === 'quick') return `<div class="pv-wrap">${cap(side === 't' ? 'On your site · click Quick View to see the modal with click data' : 'On your site')}${siteCard({ quick: side === 't', heat: side === 't', clickable: side === 't' })}</div>`;
  return `<div class="pv-wrap">${cap('Product page on your site · number = share who added to cart')}${buyBox(e, side)}</div>`;
}
function pExperiment(key) {
  const e = EBY[key];
  if (!e) return pNotFound();
  const st = wstate();
  const lead = e.lead;
  const progressTxt = `${fmt(e.people)} of ~${fmt(e.needed)} people needed`;
  const head = `
  <div class="fade">
    <div class="crumbs"><a href="#/experiments">Experiments</a>${ic('chevR', 'sm')}<span>${e.name}</span></div>
    <div class="xhead">
      <div><h2>${e.name}</h2><div class="meta">${statusBadge(e.status)}<code class="flag">${e.key}</code><span>${e.desc}</span>${e.days ? `<span class="faint">· ${e.days} days · since ${e.start}</span>` : ''}</div></div>
      <div class="card-a">
        <button class="btn" data-act="explain" data-key="${e.key}">${ic('spark')} Explain this</button>
      </div>
    </div>
  </div>`;
  const warn = [];
  if (e.status === 'Running' && e.progress < 50) warn.push(`<div class="warnbar fade">${ic('info')}<span>Not enough people yet for a reliable answer: ${progressTxt} (${e.progress}%).</span></div>`);


  const verdict = st === 'normal' ? `
  <section class="card verdict ${lead ? '' : 'neutral'} fade">
    <div>
      <h2>${e.verdict[0]}</h2>
      <p class="vb">${e.verdict[1]}</p>
    </div>
    <div class="gauge">
      <span class="lbl">Chance treatment is better</span>
      <span class="big">${countUp(e.chance, 'int')}%</span>
      <div class="conf"><i style="width:${e.chance}%"></i></div>
      <div class="pl" style="margin-top:2px"><span>${progressTxt}</span><span>${e.progress}%</span></div>
    </div>
  </section>` : `<section class="card fade"><div class="card-b">${stateBody('text', () => '')}</div></section>`;

  const vcard = side => {
    const v = e[side], rate = side === 'c' ? e.rc : e.rt, isT = side === 't';
    const leading = isT && lead;
    return `<section class="card var-card ${leading ? 'leading' : ''} fade" style="--d:${isT ? 60 : 0}ms">
      ${st !== 'normal' ? stateBody('kpi', () => '') : `
      <div class="row"><span class="lbl">${isT ? 'Treatment' : 'Control'}</span>${leading ? `<span class="tag lead">★ Leading</span>` : ''}</div>
      <div class="vname">“${esc(v.label)}”</div>
      <div class="rate">${countUp(rate, 'pct')}<small>${e.verb}</small></div>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);flex-wrap:wrap">
        <span><b style="color:var(--text)">${fmt(v.conv)}</b> of ${fmt(v.people)} people who saw it</span>
        ${isT ? `<span class="delta ${e.lift > 0 ? 'up' : 'down'}">${e.lift > 0 ? '▲' : '▼'} ${e.lift > 0 ? '+' : '−'}${Math.abs(e.lift).toFixed(e.lift % 1 && Math.abs(e.lift) < 10 ? 1 : 0)}% lift</span>` : `<span class="faint">baseline</span>`}
      </div>
      ${previewHTML(e, side)}`}
    </section>`;
  };
  const labels = expLabels(e);
  const conv = card({ src: srcLine(['experiment_tracking', e.mtable]), title: 'Conversion over time', sub: `Share of people who ${e.verb}, cumulative`, kind: 'chart', d: 120,
    actions: `<div class="legend"><span class="lg" style="--c:var(--text3);cursor:default"><i></i>${esc(e.c.label)}</span><span class="lg" style="--c:${lead ? 'var(--accent)' : 'var(--c1)'};cursor:default"><i></i>${esc(e.t.label)}</span></div>`,
    body: () => areaChart('conv', labels, [
      { key: 'c', name: e.c.label, color: 'var(--text3)', values: e.series.c, dash: true },
      { key: 't', name: e.t.label, color: lead ? 'var(--accent)' : 'var(--c1)', values: e.series.t, fill: true, w: 2 },
    ], { min: Math.floor(Math.min(...e.series.c, ...e.series.t) - 2), max: Math.ceil(Math.max(...e.series.c, ...e.series.t) + 2), fmt: v => v.toFixed(0) + '%', unit: '%', w: 1180, h: 300, label: 'Conversion over time' }) });

  const dp = dailyPeople(e);
  const extra = `<div class="grid g2">
    ${card({ src: srcLine(['GrowthBook results API']), title: 'How big is the lift?', sub: 'Likely range of the true lift · indicative', kind: 'chart', d: 140, body: () => liftRange(e) })}
    ${card({ src: srcLine(['experiment_tracking']), title: 'People per day', sub: 'New people entering each variant', kind: 'chart', d: 160,
      actions: `<div class="mini-legend"><span><i style="--c:var(--text3)"></i>${esc(e.c.label)}</span><span><i style="--c:${lead ? 'var(--accent)' : 'var(--c1)'}"></i>${esc(e.t.label)}</span></div>`,
      body: () => barChart('daily', labels, [{ name: e.c.label, color: 'var(--text3)', values: dp.c, alpha: .55 }, { name: e.t.label, color: lead ? 'var(--accent)' : 'var(--c1)', values: dp.t }], { w: 520, h: 230, every: 2, label: 'People per day' }) })}
  </div>`;
  const race = card({ src: srcLine(['experiment_tracking', e.mtable]), title: 'The race so far', sub: `Each runner goes as far as their ${e.metricShort} · ${fmt(e.people)} of ~${fmt(e.needed)} people in`, kind: 'chart', d: 100,
    body: () => { const max = Math.ceil(Math.max(e.rc, e.rt) / 5) * 5 + 3;
      const lane = (side, lk) => { const v = e[side], rate = side === 'c' ? e.rc : e.rt, isLead = side === 't' && lead;
        return `<div class="lane ${isLead ? 'lead' : ''}"><span class="tagl">${side === 't' ? 'Treatment' : 'Control'} · “${esc(v.label)}” <b>${pct(rate)}</b></span><span class="track"></span><span class="finish"></span>
          <div class="runner walking run" data-to="${(rate / max * 92 + 3).toFixed(1)}" style="left:3%">${isLead ? '<span class="crown">★</span>' : ''}${person(lk, 54)}</div></div>`; };
      return `<div class="race">${lane('c', { skin: '#E0AC83', shirt: '#8A90A0', pants: '#3E4C6E', hair: '#5A3A22', style: 'short' })}${lane('t', { skin: '#9A6644', shirt: lead ? '#6E56CF' : '#4F72D0', pants: '#2D3142', hair: '#1C1C1C', style: 'cap' })}</div>
        <div class="race-axis"><span>0%</span><span>${(max / 2).toFixed(0)}%</span><span>${max}% ${e.metricShort}</span></div>`; } });
  return head + warn.join('') + verdict + trafficLine(e) + `<div class="grid g2">${vcard('c')}${vcard('t')}</div>` + race + conv + extra;
}

// Traffic split: people entering each variant in the last 24 hours, against the 50 / 50 the test expects.
// More than 5 points off is flagged.
function trafficLine(e) {
  const dp = dailyPeople(e), n = dp.c.length - 1, c = dp.c[n], t = dp.t[n], pc = c / (c + t) * 100, off = Math.abs(pc - 50) > 5;
  const r = v => Math.round(v);
  return `<div class="traffic ${off ? 'off' : ''} fade">
    <span class="tl-ic">${ic(off ? 'warn' : 'check', 'sm')}</span>
    <div class="tl-txt"><b>Traffic split ${r(pc)} / ${r(100 - pc)}</b><span>Last 24 hours · ${fmt(c)} vs ${fmt(t)} people · expected 50 / 50</span></div>

// AI explainer drawer: plain words first, then every number it used.
function explainHTML(e) {
  const nums = [['Control · people who saw it', fmt(e.c.people)], [`Control · ${e.verb}`, `${fmt(e.c.conv)} (${pct(e.rc)})`], ['Treatment · people who saw it', fmt(e.t.people)], [`Treatment · ${e.verb}`, `${fmt(e.t.conv)} (${pct(e.rt)})`], ['Relative lift', `${e.lift > 0 ? '+' : '−'}${Math.abs(e.lift).toFixed(1)}%`], ['Chance treatment is better', e.chance + '%'], ['People needed', '~' + fmt(e.needed)], ['Pace', `~${Math.round(e.people / e.days)} people/day`]];
  const table = `<div class="masked">${nums.map(([k, v]) => `<div><span>${k}</span><b class="tnum" style="font-family:var(--font);font-weight:600">${v}</b></div>`).join('')}</div>`;
  const remaining = Math.max(0, e.needed - e.people), daysLeft = Math.ceil(remaining / (e.people / e.days));
  const text = e.key === 'add-to-cart'
    ? `<p>People who saw <b>“Buy Now”</b> added a product to their cart more often than people who saw <b>“Add to Cart”</b>: about <b>12 in every 100</b> instead of <b>10</b>. That's a 20% relative improvement.</p>
       <p>With 2,000 people so far, there's roughly a <b>94% chance</b> Buy Now is genuinely better and not just luck. That's promising but not settled. About 600 more people (~3 days at the current pace) would make it safer.</p>

    : `<p><b>“${esc(e.t.label)}”</b>: <b>${pct(e.rt)}</b> of people ${e.verb},  vs <b>${pct(e.rc)}</b> for <b>“${esc(e.c.label)}”</b>, a ${e.lift > 0 ? 'lift' : 'drop'} of ${Math.abs(e.lift).toFixed(1)}%.</p>
       <p>The chance the treatment is better is about <b>${e.chance}%</b>. That's too uncertain to act on. About ${fmt(remaining)} more people${daysLeft ? ` (~${daysLeft} days)` : ''} are needed.</p>`;
  return `<div class="dh"><div><h3>${ic('spark')} Explain this experiment</h3><p>${e.name}</p></div><button class="btn ghost icon-btn" data-act="closeAll" aria-label="Close">${ic('x')}</button></div>

function matchAnswer(q) {
  const s = q.toLowerCase();
  if (/buy now|test|experiment|variant|winning/.test(s)) return ANSWERS.buyNow;
  if (/drop|funnel|quick view/.test(s)) return ANSWERS.dropoff;
  if (/categor|size|sell/.test(s)) return ANSWERS.sizes;

// types an AI answer out character by character, like it's being written
function typeOut() {
  $$('.a[data-type]').forEach(el => {
    const full = el.dataset.type; el.removeAttribute('data-type');
    if (reducedMotion()) { el.textContent = full; el.classList.remove('typing'); return; }
    let i = 0; const t = setInterval(() => { i += 2; el.textContent = full.slice(0, i); if (i >= full.length) { clearInterval(t); el.classList.remove('typing'); } }, 18);
  });
}
function askQuestion(q) {
  q = q.trim(); if (!q) return;
  const id = Math.random();
  S.ask.unshift({ q, thinking: true, id });
  if (route().page !== 'ask') nav('#/ask'); else render();
  setTimeout(() => {
    const i = S.ask.findIndex(a => a.id === id); if (i < 0) return;
    const m = matchAnswer(q);
    S.ask[i] = m ? { ...m, q, id, fresh: true } : { q, unknown: true, id };
    if (route().page === 'ask' && !S.booting) { render(); typeOut(); }
    if (S.ask[i]) S.ask[i].fresh = false;
  }, 1100);
}
